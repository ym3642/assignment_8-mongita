{% extends 'base.html' %}

{% block container %}
<main style="padding:40px; max-width:620px; margin:auto;">

    <h2>Create New Book</h2>

    <form method="POST" action="{{ url_for('create_post') }}">

        <label>Title:</label><br>
        <input type="text" name="title" required style="width:100%; padding:6px; margin-bottom:14px; box-sizing:border-box;"><br>

        <label>Author:</label><br>
        <input type="text" name="author" required style="width:100%; padding:6px; margin-bottom:14px; box-sizing:border-box;"><br>

        <label>ISBN:</label><br>
        <input type="text" name="isbn" required style="width:100%; padding:6px; margin-bottom:14px; box-sizing:border-box;"><br>

        <label>Price:</label><br>
        <input type="number" step="0.01" min="0" name="price" required style="width:100%; padding:6px; margin-bottom:14px; box-sizing:border-box;"><br>

        <label>Category:</label><br>
        <select name="categoryId" required style="width:100%; padding:6px; margin-bottom:14px; box-sizing:border-box;">
            <option value="" disabled selected>-- Select a category --</option>
            {% for cat in categories %}
                <option value="{{ cat['categoryId'] }}">{{ cat['categoryName'] }}</option>
            {% endfor %}
        </select><br>

        <label>Image Filename:</label><br>
        <input type="text" name="image" placeholder="example.jpg" required style="width:100%; padding:6px; margin-bottom:14px; box-sizing:border-box;"><br>

        <label>Read Now:</label><br>
        <select name="readNow" style="width:100%; padding:6px; margin-bottom:20px; box-sizing:border-box;">
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select><br>

        <button type="submit" class="actionButton" style="width:auto; padding:0 20px;">Add Book</button>
        &nbsp;
        <a href="{{ url_for('read') }}" class="actionButton"
           style="width:auto; padding:0 20px; background:#888;">Cancel</a>

    </form>

</main>
{% endblock %}
